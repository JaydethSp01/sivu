sonar.projectKey=sivu
sonar.organization=uempresarial
sonar.projectName=SIVU - Sistema de Vinculación Universitaria
sonar.projectVersion=1.0.0

# Sources / tests
sonar.sources=backend/src/main/java,frontend/src,mcp-server/src
sonar.tests=backend/src/test/java,tests/cypress/cypress/e2e,tests/k6
sonar.test.inclusions=**/*Test.java,**/*.cy.ts,**/*.js
sonar.exclusions=**/target/**,**/dist/**,**/build/**,**/node_modules/**,**/coverage/**,frontend/src/components/ui/**

# Java
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript / JS
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,mcp-server/coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/dto/**,**/config/**,**/*Mapper*,**/SivuApplication.java,**/main.tsx,**/components/ui/**
