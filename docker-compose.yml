name: sivu

services:
  postgres:
    image: postgres:16-alpine
    container_name: sivu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sivu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sivu-net]

  mongo:
    image: mongo:7
    container_name: sivu-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - sivu_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sivu-net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sivu-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks: [sivu-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sivu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@sivu.uempresarial.edu.co}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks: [sivu-net]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
    container_name: sivu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks: [sivu-net]

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: sivu-mcp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MCP_BACKEND_BASE_URL: http://backend:8080/api/v1
      MCP_SERVICE_USER: ${MCP_SERVICE_USER}
      MCP_SERVICE_PASSWORD: ${MCP_SERVICE_PASSWORD}
    stdin_open: true
    tty: true
    networks: [sivu-net]

networks:
  sivu-net:
    driver: bridge

volumes:
  sivu_postgres_data:
  sivu_mongo_data:
