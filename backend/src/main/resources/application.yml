spring:
  application:
    name: sivu-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Carga por lotes las colecciones LAZY: evita N+1 sin caer en
        # MultipleBagFetchException al traer entidades con 2+ List. Global
        # a todos los perfiles (dev lo reafirma en su YAML).
        default_batch_fetch_size: 16
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: ${APP_TIMEZONE:America/Bogota}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  # En PaaS (Render) el puerto lo inyecta la plataforma vía $PORT.
  port: ${PORT:8080}
  error:
    # Mensajes detallados solo en dev/docker. En producción mejor 'never'/'on_param'.
    include-message: on_param
    include-binding-errors: on_param

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    persistAuthorization: true

app:
  security:
    jwt:
      # Obligatorio definir JWT_SECRET via variable de entorno en cualquier despliegue.
      # Los perfiles dev/test definen un default explícito en sus YAMLs respectivos.
      # Si no se define en prod, la app falla al arrancar (lo cual es lo que queremos).
      secret: ${JWT_SECRET:}
      access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  mail:
    from: ${APP_MAIL_FROM:no-reply@sivu.uempresarial.edu.co}
    enabled: true
  universidad:
    api-base: ${APP_UNIVERSIDAD_API_BASE:http://localhost:8080/api/v1/mock-universidad}
    creditos-minimos: 120
    promedio-minimo: 3.5
  matching:
    score-minimo-recomendacion: 70
  ia:
    # URL del IA sidecar (Node + claude-agent-sdk con plan Claude Code, sin API key).
    # Vacío = revisor heurístico local. Ej local: http://localhost:8090
    sidecar-url: ${IA_SIDECAR_URL:}
  alertas:
    plazos:
      enabled: ${ALERTAS_PLAZOS_ENABLED:true}
      dias-anticipacion: ${ALERTAS_PLAZOS_DIAS:3}
