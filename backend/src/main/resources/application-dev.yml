spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sivu
    username: sivu
    password: sivu_dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SivuHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 16
    show-sql: false
  data:
    mongodb:
      uri: mongodb://sivu_admin:mongo_dev_password@localhost:27017/sivu_users?authSource=admin
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Default solo para entorno de desarrollo local. En prod usa env var JWT_SECRET.
      secret: ${JWT_SECRET:dev_only_secret_dev_only_secret_dev_only_secret_dev_only_secret_xxxx}

logging:
  level:
    co.uempresarial.sivu: DEBUG
    org.springframework.security: INFO
